services:
  - type: web
    name: maintenance-app
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /index.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        sync: false
      - key: SMS_ENABLED
        value: "true"
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_NAME
        value: MOTOFIX
      - key: IPROG_SMS_PROVIDER
        value: "2"
      - key: SMS_DEBUG
        value: "false"
